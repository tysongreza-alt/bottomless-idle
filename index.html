<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), SAVE_KEY='bottomless_idle_v3', OLD_SAVE_KEY='bottomless_idle_v1', BACKUP_KEY='bottomless_idle_v14_backup', H=1.13, R=1.09;
class Big {
 constructor(m=0,e=0){if(!(m>0)||!Number.isFinite(m)){this.m=0;this.e=0;return}let shift=Math.floor(Math.log10(m));this.m=m/Math.pow(10,shift);this.e=e+shift;if(this.m>=10){this.m/=10;this.e++}if(this.m<1){this.m*=10;this.e--}}
 static num(n){if(n instanceof Big)return n;return new Big(n)}
 static log(l){if(!Number.isFinite(l))return new Big();let e=Math.floor(l);return new Big(Math.pow(10,l-e),e)}
 static pow(base,p){return Big.log(Math.log10(base)*p)}
 static read(v){if(Array.isArray(v)&&v.length===2)return new Big(Number(v[0]),Number(v[1]));return Big.num(Number(v)||0)}
 pack(){return [this.m,this.e]}
 cmp(b){b=Big.num(b);if(this.m===0||b.m===0)return Math.sign(this.m-b.m);return this.e===b.e?Math.sign(this.m-b.m):Math.sign(this.e-b.e)}
 add(b){b=Big.num(b);if(!this.m)return b;if(!b.m)return this;let a=this;if(b.e>a.e)[a,b]=[b,a];if(a.e-b.e>16)return a;return new Big(a.m+b.m*Math.pow(10,b.e-a.e),a.e)}
 sub(b){b=Big.num(b);if(this.cmp(b)<=0)return new Big();if(this.e-b.e>16)return this;return new Big(this.m-b.m*Math.pow(10,b.e-this.e),this.e)}

{text:'Close',click:close},{text:'Artifacts',click:showCollection},{text:'Specimens',click:showSpecimens},{text:'Special encounters',click:showEncounters},{text:'Milestones',click:showMilestones},{text:'Drill stages',click:showStages},{text:'Export save',click:exportSave},{text:'Import save',click:importSave},{text:'Old v0.1 game',click:openLegacy},{text:'Start over',className:'danger',click:resetConfirm}])}
function exportSave(){save();const raw=localStorage.getItem(SAVE_KEY),blob=new Blob([raw],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bottomless-v2-save.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);close();notify('Save backup exported')}
function importSave(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.addEventListener('change',async()=>{try{const o=JSON.parse(await input.files[0].text());if(!o||(o.version!==3&&o.version!==4)||!o.up||!Array.isArray(o.coins))throw Error('Invalid save');const old=s;if(!loadObj(o)){s=old;throw Error('Invalid save')}save();close();updateUI();notify('Save restored successfully')}catch(err){notify('Could not import that save file')}});input.click()}
function resetConfirm(){showDialog('Erase your progress?',`<p>This deletes the save on this device, including all depth records, coins, cores, and discoveries. You cannot undo this without a backup.</p>`,[{text:'Cancel',click:close},{text:'Erase and restart',className:'danger',click:()=>{s=fresh();s.hp=hpAt(0);save();close();updateUI();notify('Fresh expedition started')}}])}
function rebuildConfirm(){const c=eligibleCores();if(!c)return;showDialog('Rebuild your machine?',`<p>Trade this run for <strong>+${c} permanent ${c===1?'core':'cores'}</strong>. Your first 12 cores retain the original 20% damage and 15% coin multipliers. Later cores grant smaller permanent increases to prevent runaway growth.</p><p>Your coin balance, temporary upgrades, and current depth restart at zero. Your personal best and discoveries stay forever.</p><p class="small">Rebuilding is optional. You can keep digging instead.</p>`,[{text:'Keep digging',click:close},{text:'Rebuild +'+c,className:'primary',click:()=>{close();rebuild()}}])}
function hitParticles(label){const W=canvas.clientWidth,Hh=canvas.clientHeight,env=biome(s.depth);for(let i=0;i<16;i++){const angle=Math.random()*Math.PI*2,speed=1+Math.random()*5;particles.push({x:W*.5,y:Hh*.62,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-2,life:25+Math.random()*18,color:i%3===0?'#ffd46f':env.gem,size:2+Math.random()*4})}particles=particles.slice(-140);texts.push({x:W*.5,y:Hh*.60,text:label,life:58});texts=texts.slice(-12)}
// Drill pressure is ephemeral: never stored in a save, no offline benefits.
// It takes 25 taps (+0.08 each) to reach 3x. Hold for 10s after the last tap,
// then decay at a constant rate from 3x to 1x over 60s. No offline boost.
const PRESSURE_GAIN=.08, PRESSURE_HOLD_MS=10000, PRESSURE_DECAY_PER_SEC=2/60;
function tapPressure(){
 if(!visible||$('overlay').classList.contains('show'))return;
 const now=performance.now();if(now-lastPressureInput<75)return;
 lastPressureInput=now;lastPressureTap=now;
 pressure=Math.min(3,pressure+PRESSURE_GAIN);
 shake=Math.min(4,shake+1.2);
 updateUI();
}
function decayPressure(delta,now){
 if(pressure<=1)return;
 if(now-lastPressureTap>PRESSURE_HOLD_MS)pressure=Math.max(1,pressure-delta*PRESSURE_DECAY_PER_SEC);
}
function doSlam(){if(Date.now()-lastSlam<12000)return;lastSlam=Date.now();s.slams++;applyDamage(hpAt(s.depth).mul(.10).add(dps().mul(3)).mul(1+slamTrait()));shake=18;hitParticles('POWER SLAM!');save();updateUI();notify('POWER SLAM!')}

document.querySelectorAll('[data-upgrade]').forEach(el=>el.addEventListener('click',()=>buy(el.dataset.upgrade)));$('modeBtn').addEventListener('click',()=>{mode=mode==='1'?'max':'1';updateUI()});$('slamBtn').addEventListener('click',doSlam);$('pressurePad').addEventListener('pointerdown',tapPressure);$('pressurePad').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tapPressure()}});canvas.addEventListener('pointerdown',tapPressure);$('rebuildBtn').addEventListener('click',rebuildConfirm);$('treasure').addEventListener('click',showCollection);$('eventLogBtn').addEventListener('click',showEncounters);$('corePanel').addEventListener('click',showCores);$('nextCoreBtn').addEventListener('click',showCores);$('dialogClose').addEventListener('click',close);$('menuBtn').addEventListener('click',showMenu);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
try{const saved=localStorage.getItem(SAVE_KEY);if(saved&&JSON.parse(saved).version===3&&!localStorage.getItem(BACKUP_KEY)){localStorage.setItem(BACKUP_KEY,saved)}if(saved&&loadObj(JSON.parse(saved))){if(JSON.parse(saved).version===3)save();const away=Math.max(0,(Date.now()-s.lastSave)/1000);if(away>5){const before=s.depth,oldCoins=s.coins;simulate(away,true);save();const earned=s.coins.sub(oldCoins);const finds=s.pendingFinds.slice();s.pendingFinds=[];save();const findText=finds.length?'<p><strong>New specimens:</strong> '+finds.slice(0,3).map(id=>SPECIMEN_BY_ID.get(id)?.name).filter(Boolean).join(', ')+(finds.length>3?' and '+(finds.length-3)+' more':'')+'</p>':'';setTimeout(()=>showDialog('Welcome back!',`<p>Your drill kept running while you were away for <strong>${away>=3600?(away/3600).toFixed(1)+' hours':Math.floor(away/60)+' minutes'}</strong>.</p><p><strong style="color:#ffcf78">+${earned.fmt()} coins</strong><br><strong style="color:#8fe5ee">+${(s.depth-before).toLocaleString()} layers</strong> drilled</p>${findText}<p>Time to buy some upgrades and go deeper.</p>`,[{text:'Keep digging!',className:'primary',click:close}]),300)}}else{s.hp=hpAt(0);save();if(localStorage.getItem(OLD_SAVE_KEY))setTimeout(()=>showDialog('New balanced expedition',`<p>Welcome to <strong>BOTTOMLESS 2.0</strong>! This edition adds evolving drills, permanent specimens, encounters and meaningful milestones.</p><p><strong>Your original progress has not been deleted.</strong> Open v0.1 Legacy from the menu any time. The new balanced version starts a separate save because the old economy advanced thousands of times too fast.</p>`,[{text:'Play BOTTOMLESS 2.0',className:'primary',click:close},{text:'Open my old game',click:openLegacy}]),450)}}catch(err){s=fresh();s.hp=hpAt(0)}
function frame(now){let delta=Math.max(0,(now-lastFrame)/1000);lastFrame=now;if(delta>0&&visible){decayPressure(Math.min(delta,60),now);simulate(Math.min(delta,60));if(delta>60)simulate(delta-60,true)}if(now-lastUi>160){updateUI();lastUi=now}draw();if(Date.now()-lastSave>4000)save();requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){visible=false;pressure=1;lastPressureTap=0;save()}else{visible=true;pressure=1;lastPressureTap=0;const away=(Date.now()-lastSave)/1000;if(away>1)simulate(away,true);lastFrame=performance.now();updateUI()}});window.addEventListener('pagehide',save);s.hp=s.hp||hpAt(s.depth);updateUI();requestAnimationFrame(frame);
})();
</script>
