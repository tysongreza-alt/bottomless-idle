<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), SAVE_KEY='bottomless_idle_v3', OLD_SAVE_KEY='bottomless_idle_v1', H=1.13, R=1.09;
class Big {
 constructor(m=0,e=0){if(!(m>0)||!Number.isFinite(m)){this.m=0;this.e=0;return}let shift=Math.floor(Math.log10(m));this.m=m/Math.pow(10,shift);this.e=e+shift;if(this.m>=10){this.m/=10;this.e++}if(this.m<1){this.m*=10;this.e--}}
 static num(n){if(n instanceof Big)return n;return new Big(n)}
 static log(l){if(!Number.isFinite(l))return new Big();let e=Math.floor(l);return new Big(Math.pow(10,l-e),e)}
 static pow(base,p){return Big.log(Math.log10(base)*p)}
 static read(v){if(Array.isArray(v)&&v.length===2)return new Big(Number(v[0]),Number(v[1]));return Big.num(Number(v)||0)}
 pack(){return [this.m,this.e]}
 cmp(b){b=Big.num(b);if(this.m===0||b.m===0)return Math.sign(this.m-b.m);return this.e===b.e?Math.sign(this.m-b.m):Math.sign(this.e-b.e)}
 add(b){b=Big.num(b);if(!this.m)return b;if(!b.m)return this;let a=this;if(b.e>a.e)[a,b]=[b,a];if(a.e-b.e>16)return a;return new Big(a.m+b.m*Math.pow(10,b.e-a.e),a.e)}
 sub(b){b=Big.num(b);if(this.cmp(b)<=0)return new Big();if(this.e-b.e>16)return this;return new Big(this.m-b.m*Math.pow(10,b.e-this.e),this.e)}
 mul(b){b=Big.num(b);return new Big(this.m*b.m,this.e+b.e)}
 div(b){b=Big.num(b);return b.m?new Big(this.m/b.m,this.e-b.e):new Big()}
 number(){if(this.e>307)return Infinity;if(this.e< -300)return 0;return this.m*Math.pow(10,this.e)}
 log10(){return this.m?Math.log10(this.m)+this.e:-Infinity}
 fmt(d=1){if(!this.m)return '0';if(this.e<3){const n=this.number();return n>=100?n.toFixed(0):n>=10?n.toFixed(1):n.toFixed(d)}const suffix=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid','Sxd','Spd','Ocd','Nod'];const group=Math.floor(this.e/3);if(group<suffix.length){const val=this.m*Math.pow(10,this.e%3);return (val>=100?val.toFixed(0):val>=10?val.toFixed(1):val.toFixed(2)).replace(/\.0+$/,'').replace(/(\.\d*[1-9])0+$/,'$1')+suffix[group]}return this.m.toFixed(2)+'e'+this.e}
}
const b=n=>Big.num(n), pow=(r,e)=>Big.pow(r,e);
function fresh(){return {version:3,coins:b(0),depth:0,best:0,hp:null,up:{power:0,speed:0,value:0},cores:0,rebuilt:0,slams:0,discoveries:[],totalLayers:0,created:Date.now(),lastSave:Date.now()}}
let s=fresh(), mode='1', lastFrame=performance.now(), lastUi=0, lastSave=Date.now(), hitAcc=0, lastSlam=Date.now()-20000, slamCharge=0, particles=[],texts=[],shake=0, anim=0, toastTimer, visible=true;
const STARTS=[0,40,100,200,350,550], BIOMES=[{name:'Surface Soil',top:'#594431',bottom:'#8f6143',accent:'#dec295',gem:'#edc58d'},{name:'Iron Slate',top:'#37475b',bottom:'#566d7d',accent:'#a0d0e5',gem:'#9ec6fa'},{name:'Ember Caverns',top:'#5b2c36',bottom:'#9b4b32',accent:'#f6a65a',gem:'#ff8a51'},{name:'Crystal Deep',top:'#263c62',bottom:'#365b8b',accent:'#c197ff',gem:'#8ff9fc'},{name:'Lost Ruins',top:'#4c4059',bottom:'#777074',accent:'#d7c69a',gem:'#ffe3a5'},{name:'The Deep Unknown',top:'#191c40',bottom:'#463a73',accent:'#ac7bff',gem:'#e298fa'},{name:'Subterranean Ocean',top:'#083955',bottom:'#145772',accent:'#69d9ef',gem:'#8bf9ff'},{name:'Starfall Veins',top:'#27335e',bottom:'#684c86',accent:'#f0b8fd',gem:'#ffe1ff'},{name:'Ancient Reactor',top:'#304b3d',bottom:'#677644',accent:'#deff78',gem:'#c9ffb2'}];
const biomeId=d=>{if(d<550){let i=0;while(i<STARTS.length-1&&d>=STARTS[i+1])i++;return i}return 5+Math.floor((d-550)/300)%4}, biome=d=>BIOMES[biomeId(d)];
const ARTIFACTS=[
 {depth:25,name:'Amber Firefly',description:'A tiny insect suspended in honey-colored amber.'},
 {depth:55,name:'Iron Rose',description:'A metal flower buried beneath the oldest slate.'},
 {depth:90,name:'Smoldering Crown',description:'Still warm, though nobody knows who wore it.'},
 {depth:130,name:'Crystal Heart',description:'Its pulse can be felt through solid stone.'},
 {depth:180,name:'Forgotten Compass',description:'It points to something far below.'},
 {depth:245,name:'Clockwork Beetle',description:'An ancient machine that still twitches.'},
 {depth:325,name:'Sunken Pearl',description:'Glows with the memory of an underground sea.'},
 {depth:415,name:'Whispering Geode',description:'A crystal that softly hums when opened.'},
 {depth:520,name:'The Stone Dragon',description:'A fossil unlike any creature ever recorded.'},
 {depth:650,name:'Void Lantern',description:'Its purple light casts no shadows.'},
 {depth:790,name:'Ancient Star Chart',description:'A map of constellations that no longer exist.'},
 {depth:950,name:'Reactor Key',description:'Made for a machine that predates civilization.'},
 {depth:1130,name:'Eternal Ember',description:'A flame that burns without consuming fuel.'},
 {depth:1350,name:'Gravity Marble',description:'Impossible to drop, impossible to explain.'},
 {depth:1600,name:'Diamond Seed',description:'A gemstone with roots instead of facets.'},
 {depth:1900,name:'The First Drill Bit',description:'Someone reached these depths long before you.'},
 {depth:2250,name:'Timeglass Hour',description:'The sand falls upward, one grain at a time.'},
 {depth:2700,name:'Bottomless Emblem',description:'An insignia engraved with the words: KEEP DIGGING.'},
 {depth:3400,name:'Echo of the Surface',description:'A perfect miniature of the world above.'},
 {depth:4400,name:'The Deepest Bell',description:'A bell that rings without being struck.'},
 {depth:5800,name:'Living Meteorite',description:'A fallen star that is still growing.'},
 {depth:7600,name:'Endless Map',description:'A map that grows each time it is unfolded.'}
];
const artifactNames=new Set(ARTIFACTS.map(a=>a.name));
const collectionBonus=()=>1+s.discoveries.length*.02;
const coreBonus=()=>pow(1.20,Math.min(s.cores,100000));
const coreCoinBonus=()=>pow(1.15,Math.min(s.cores,100000));
const nextRegion=d=>{for(const v of STARTS)if(v>d)return v;return 550+(Math.floor(Math.max(0,d-550)/300)+1)*300};
function hpAt(depth){return b(20).mul(pow(H,depth))}
function rewardAt(depth){return b(7).mul(pow(R,depth)).mul(pow(1.28,s.up.value)).mul(collectionBonus()).mul(coreCoinBonus())}
function dmg(){return b(10).mul(pow(1.28,s.up.power)).mul(coreBonus())}
function rate(){return 1+s.up.speed*.20}
function dps(){return dmg().mul(rate())}
function price(which,lvl=s.up[which]){const x={power:[15,1.70],speed:[25,1.55],value:[35,1.74]}[which];return b(x[0]).mul(pow(x[1],lvl))}
function geo(first,r,n){if(n<=0)return b(0);return first.mul(pow(r,n).sub(1)).div(r-1)}
function bonusSum(start,n,step,extra){if(!n)return b(0);const finish=start+n-1;const first=Math.ceil(start/step)*step;if(first>finish)return b(0);const count=Math.floor((finish-first)/step)+1;return geo(rewardAt(first),Math.pow(R,step),count).mul(extra)}
function layerPayout(depth){let out=rewardAt(depth);if((depth+1)%25===0)out=out.mul(4);if((depth+1)%100===0)out=out.mul(4);return out}
function summedPayout(start,n){let v=geo(rewardAt(start),R,n); // bonus layers are 1-based depths
 const newStart=start+1,end=start+n;for(const [step,xtra] of [[25,3],[100,12]]){const firstDepth=Math.ceil(newStart/step)*step;if(firstDepth>end)continue;const num=Math.floor((end-firstDepth)/step)+1;v=v.add(geo(rewardAt(firstDepth-1),Math.pow(R,step),num).mul(xtra))}return v
}
function save(){try{const data={version:3,coins:s.coins.pack(),depth:s.depth,best:s.best,hp:(s.hp||hpAt(s.depth)).pack(),up:s.up,cores:s.cores,rebuilt:s.rebuilt,slams:s.slams,discoveries:s.discoveries,totalLayers:s.totalLayers,created:s.created,lastSave:Date.now()};localStorage.setItem(SAVE_KEY,JSON.stringify(data));lastSave=Date.now();$('saved').textContent='Saved locally'}catch(err){$('saved').textContent='Save unavailable'}}
function loadObj(o){if(!o||o.version!==3||!o.up)return false;let t=fresh();t.coins=Big.read(o.coins);t.depth=Math.max(0,Math.min(1e9,Math.floor(Number(o.depth)||0)));t.best=Math.max(t.depth,Math.min(1000000000,Math.floor(Number(o.best)||0)));t.hp=Big.read(o.hp);if(!t.hp.m||t.hp.cmp(hpAt(t.depth))>0)t.hp=hpAt(t.depth);for(const k of ['power','speed','value'])t.up[k]=Math.max(0,Math.min(100000,Math.floor(Number(o.up[k])||0)));t.cores=Math.max(0,Math.min(100000,Math.floor(Number(o.cores)||0)));t.rebuilt=Math.max(0,Math.min(100000,Math.floor(Number(o.rebuilt)||0)));t.slams=Math.max(0,Math.floor(Number(o.slams)||0));t.discoveries=Array.isArray(o.discoveries)?[...new Set(o.discoveries.filter(x=>artifactNames.has(x)))]:[];t.totalLayers=Math.max(t.depth,Math.min(Number.MAX_SAFE_INTEGER,Math.floor(Number(o.totalLayers)||0)));t.created=Number(o.created)||Date.now();t.lastSave=Math.max(0,Math.min(Date.now(),Number(o.lastSave)||Date.now()));s=t;return true}
function layerEffects(count, offline){if(offline)return;shake=Math.min(20,shake+4+Math.min(8,count));const W=canvas.clientWidth,Hh=canvas.clientHeight;const bg=biome(s.depth);for(let i=0;i<Math.min(25,10+count*2);i++){const a=Math.random()*Math.PI*2,v=1+Math.random()*4;particles.push({x:W*.5+(Math.random()-.5)*100,y:Hh*.56,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:30+Math.random()*25,color:Math.random()>.6?bg.gem:bg.accent,size:2+Math.random()*5})}particles=particles.slice(-140);texts.push({x:W*.55,y:Hh*.56,text:'+'+layerPayout(Math.max(0,s.depth-1)).fmt(),life:70});texts=texts.slice(-12)}
function onAdvance(oldD,newD,offline){
 if(newD<=oldD)return;
 s.best=Math.max(s.best,newD);s.totalLayers+=newD-oldD;
 const found=ARTIFACTS.filter(a=>a.depth>oldD&&a.depth<=newD&&!s.discoveries.includes(a.name));
 for(const a of found)s.discoveries.push(a.name);
 if(offline)return;

function applyDamage(amount,offline=false){amount=Big.num(amount);if(!amount.m)return;let old=s.depth,earned=b(0);if(!s.hp)s.hp=hpAt(s.depth);if(amount.cmp(s.hp)<0){s.hp=s.hp.sub(amount);return}amount=amount.sub(s.hp);earned=earned.add(layerPayout(s.depth));s.depth++;const start=s.depth;const next=hpAt(start);if(amount.cmp(next)>=0){const ratio=amount.div(next);let n;

function simulate(seconds,offline=false){if(seconds<=0)return;const amount=dps().mul(seconds*(offline?.80:1));applyDamage(amount,offline)}
function affordCount(which){const cost=price(which);if(s.coins.cmp(cost)<0)return 0;if(mode==='1')return 1;const mult={power:1.70,speed:1.55,value:1.74}[which],v=s.coins.div(cost),lg=v.log10();let n=Math.max(1,Math.floor(Math.log1p(v.number()*(mult-1))/Math.log(mult)));if(lg>12)n=Math.max(1,Math.floor((lg+Math.log10(mult-1))/Math.log10(mult)));n=Math.min(100000,n);const sum=x=>geo(cost,mult,x);while(n>1&&sum(n).cmp(s.coins)>0)n--;while(n<100000&&sum(n+1).cmp(s.coins)<=0)n++;return n}
function buy(which){const n=affordCount(which);if(!n)return;const mult={power:1.70,speed:1.55,value:1.74}[which];const c=geo(price(which),mult,n);s.coins=s.coins.sub(c);s.up[which]+=n;save();updateUI();if(n>=10)notify(which.toUpperCase()+' +'+n+' levels!')}

function updateUI(){if(!s.hp)s.hp=hpAt(s.depth);$('coins').textContent=s.coins.fmt();$('depth').textContent=s.depth.toLocaleString();$('best').textContent=s.best.toLocaleString();$('biome').textContent=biome(s.depth).name;$('coreDisplay').textContent='✦ '+s.cores+' cores';$('treasure').textContent='◆ '+s.discoveries.length+'/'+ARTIFACTS.length+' artifacts';$('income').textContent='+'+dps().div(hpAt(s.depth)).mul(rewardAt(s.depth)).fmt()+'/s';const full=hpAt(s.depth);const frac=Math.max(0,Math.min(100,s.hp.div(full).number()*100));$('healthFill').style.width=frac+'%';$('healthText').textContent='LAYER '+(s.depth+1).toLocaleString()+' • '+Math.round(100-frac)+'% BROKEN';const n=nextRegion(s.depth),previous=n===40?0:n===100?40:n===200?100:n===350?200:n===550?350:n-300;$('nextMilestone').textContent='Next region: '+n.toLocaleString();$('milestoneFill').style.width=(100*Math.max(0,Math.min(1,(s.depth-previous)/(n-previous))))+'%';for(const name of ['power','speed','value']){const level=s.up[name],item=document.querySelector('[data-upgrade='+name+']'),p=price(name),can=s.coins.cmp(p)>=0;item.disabled=!can;item.classList.toggle('afford',can);$('lvl'+name).textContent='Lv '+level;$('price'+name).innerHTML=p.fmt()+'<span>COINS</span>'} $('descPower').textContent=dmg().fmt()+' damage per hit';$('descSpeed').textContent=rate().toFixed(2)+' hits / sec';$('descValue').textContent=rewardAt(s.depth).fmt()+' per layer';$('modeBtn').textContent=mode==='1'?'BUY ×1 ▾':'BUY MAX ▾';const core=eligibleCores();$('rebuildBtn').disabled=core===0;$('rebuildBtn').textContent=core?'✦ REBUILD FOR +'+core+' CORE'+(core>1?'S':''):'✦ REBUILD UNLOCKS AT 110';const elapsed=(Date.now()-lastSlam)/1000;const ready=elapsed>=20;$('slamBtn').disabled=!ready;$('slamText').textContent=ready?'TAP FOR A HUGE HIT':('Ready in '+Math.ceil(20-elapsed)+'s')}
const canvas=$('scene'),ctx=canvas.getContext('2d'),Stars=Array.from({length:20},(_,i)=>({x:(i*109.7)%401,y:(i*73.3)%301,r:1+(i%3)}));

function showDialog(title,body,buttons){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;const el=$('dialogActions');el.innerHTML='';for(const cfg of buttons){let btn=document.createElement('button');btn.textContent=cfg.text;if(cfg.className)btn.className=cfg.className;btn.addEventListener('click',cfg.click);el.appendChild(btn)}$('overlay').classList.add('show')}
function close(){ $('overlay').classList.remove('show')}
function showCollection(){const owned=new Set(s.discoveries);const next=ARTIFACTS.find(a=>!owned.has(a.name));const rows=ARTIFACTS.map((a,i)=>owned.has(a.name)?`<div class="collection-row"><span class="collection-symbol">◆</span><div><strong>${a.name}</strong><div class="small">${a.description} · Found at depth ${a.depth.toLocaleString()}</div></div></div>`:`<div class="collection-row locked"><span class="collection-symbol">◇</span><div><strong>Undiscovered Artifact ${i+1}</strong><div class="small">Explore deeper to uncover it.</div></div></div>`).join('');showDialog('Artifact collection',`<p><strong>${s.discoveries.length} of ${ARTIFACTS.length}</strong> unique artifacts found. Every artifact permanently boosts coins by <strong>+2%</strong>, even after rebuilding. Total collection bonus: <strong>+${s.discoveries.length*2}%</strong>.</p><p>${next?'Next new artifact: around depth <strong>'+next.depth.toLocaleString()+'</strong>.':'You found every artifact in the current collection!'}</p><div class="collection-scroll">${rows}</div>`,[{text:'Keep digging',className:'primary',click:close}])}
function openLegacy(){location.href='./legacy.html'}
function showMenu(){showDialog('Game menu',`<p><strong>How to play:</strong> Your drill works automatically. Buy Power, Speed, and Value upgrades. POWER SLAM gives a bonus hit every 20 seconds. Dig to depth 110 to unlock optional permanent rebuilds.</p><p><strong>Artifacts:</strong> ${s.discoveries.length} of ${ARTIFACTS.length} found. Each gives +2% permanent coin value. Ore veins every 25 layers and treasure chambers every 100 give extra coins.</p><p><strong>Your progress:</strong> ${s.totalLayers.toLocaleString()} total layers, ${s.rebuilt} rebuilds, ${s.best.toLocaleString()} best depth, ${s.cores} permanent cores.</p><p><strong>Idle progress:</strong> Your machine runs while you're away at 80% speed, without buying upgrades. Progress is saved on this device.</p><p class="small">Clearing browser data or switching phones can erase progress. Export a backup to keep it safe. Your old v0.1 progress remains separate and is available in the legacy game.</p><div class="divider"></div><p class="small">BOTTOMLESS v1.0. No ads, tracking, accounts or purchases.</p>`,[
{text:'Close',click:close},{text:'Artifacts',click:showCollection},{text:'Export save',click:exportSave},{text:'Import save',click:importSave},{text:'Old v0.1 game',click:openLegacy},{text:'Start over',className:'danger',click:resetConfirm}])}
function exportSave(){save();const raw=localStorage.getItem(SAVE_KEY),blob=new Blob([raw],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bottomless-v1-save.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);close();notify('Save backup exported')}
function importSave(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.addEventListener('change',async()=>{try{const o=JSON.parse(await input.files[0].text());if(!o||o.version!==3||!o.up||!Array.isArray(o.coins))throw Error('Invalid save');const old=s;if(!loadObj(o)){s=old;throw Error('Invalid save')}save();close();updateUI();notify('Save restored successfully')}catch(err){notify('Could not import that save file')}});input.click()}
function resetConfirm(){showDialog('Erase your progress?',`<p>This deletes the save on this device, including all depth records, coins, cores, and discoveries. You cannot undo this without a backup.</p>`,[{text:'Cancel',click:close},{text:'Erase and restart',className:'danger',click:()=>{s=fresh();s.hp=hpAt(0);save();close();updateUI();notify('Fresh expedition started')}}])}
function rebuildConfirm(){const c=eligibleCores();if(!c)return;showDialog('Rebuild your machine?',`<p>Trade this run for <strong>+${c} permanent ${c===1?'core':'cores'}</strong>. Every core permanently boosts drill damage by 20% and coins by 15%, compounding across your future runs.</p><p>Your coin balance, temporary upgrades, and current depth restart at zero. Your personal best and discoveries stay forever.</p><p class="small">Rebuilding is optional. You can keep digging instead.</p>`,[{text:'Keep digging',click:close},{text:'Rebuild +'+c,className:'primary',click:()=>{close();rebuild()}}])}

document.querySelectorAll('[data-upgrade]').forEach(el=>el.addEventListener('click',()=>buy(el.dataset.upgrade)));$('modeBtn').addEventListener('click',()=>{mode=mode==='1'?'max':'1';updateUI()});$('slamBtn').addEventListener('click',doSlam);$('rebuildBtn').addEventListener('click',rebuildConfirm);$('treasure').addEventListener('click',showCollection);$('menuBtn').addEventListener('click',showMenu);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

function frame(now){let delta=Math.max(0,(now-lastFrame)/1000);lastFrame=now;if(delta>0&&visible){simulate(Math.min(delta,60));if(delta>60)simulate(delta-60,true)}if(now-lastUi>160){updateUI();lastUi=now}draw();if(Date.now()-lastSave>4000)save();requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){visible=false;save()}else{visible=true;const away=(Date.now()-lastSave)/1000;if(away>1)simulate(away,true);lastFrame=performance.now();updateUI()}});window.addEventListener('pagehide',save);s.hp=s.hp||hpAt(s.depth);updateUI();requestAnimationFrame(frame);
